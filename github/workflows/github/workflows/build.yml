name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -o GemsPlugin.zip
      - run: mvn -B package -f GemsPlugin/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: GemsPlugin
          path: GemsPlugin/target/GemsPlugin.jar
